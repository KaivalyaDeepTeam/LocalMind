name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Check formatting with Black
        run: black --check --diff localmind tests

      - name: Check import sorting with isort
        run: isort --check-only --diff localmind tests

      - name: Lint with Ruff
        run: ruff check localmind tests

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Qt offscreen mode for headless testing
      QT_QPA_PLATFORM: offscreen
      # Disable native CPU optimizations for llama-cpp-python (fixes ARM i8mm issue)
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 xvfb libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          # Install secret service for keyring
          sudo apt-get install -y gnome-keyring dbus-x11

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Run platform-specific tests
        run: pytest tests/platform/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          pip install pytest-cov
          pytest tests/ --cov=localmind --cov-report=xml --cov-report=term-missing --cov-fail-under=30

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  platform-smoke-test:
    name: Platform Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      QT_QPA_PLATFORM: offscreen
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 xvfb libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          sudo apt-get install -y gnome-keyring dbus-x11

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify all imports work
        run: |
          python -c "from localmind.main_window import MainWindow; print('MainWindow: OK')"
          python -c "from localmind.config import Settings; print('Settings: OK')"
          python -c "from localmind.ui.theme_manager import ThemeManager; print('ThemeManager: OK')"
          python -c "from localmind.workers.transcription_worker import TranscriptionWorker; print('TranscriptionWorker: OK')"
          python -c "from localmind.llm.factory import create_llm_provider; print('LLM Factory: OK')"
          python -c "import keyring; print(f'Keyring backend: {keyring.get_keyring()}')"

      - name: Run application smoke test
        run: |
          python -c "
          import sys
          sys.exit(0)  # Placeholder - actual GUI test below
          "

      - name: Run GUI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -c "
          import os
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          from PySide6.QtWidgets import QApplication
          from localmind.main_window import MainWindow
          app = QApplication([])
          window = MainWindow()
          window.show()
          app.processEvents()
          print('GUI smoke test: PASSED')
          window.close()
          app.quit()
          "

      - name: Run GUI smoke test (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          python -c "
          import os
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          from PySide6.QtWidgets import QApplication
          from localmind.main_window import MainWindow
          app = QApplication([])
          window = MainWindow()
          window.show()
          app.processEvents()
          print('GUI smoke test: PASSED')
          window.close()
          app.quit()
          "

      - name: Verify keyring functionality
        run: |
          python -c "
          import keyring
          # Test basic keyring operations
          service = 'LocalMind-CI-Test'
          key = 'test_key'
          value = 'test_value_123'
          try:
              keyring.set_password(service, key, value)
              retrieved = keyring.get_password(service, key)
              assert retrieved == value, f'Keyring test failed: expected {value}, got {retrieved}'
              keyring.delete_password(service, key)
              print('Keyring test: PASSED')
          except Exception as e:
              print(f'Keyring test: SKIPPED ({e})')
          "

      - name: Verify audio libraries
        run: |
          python -c "
          import librosa
          import soundfile
          import numpy as np
          import scipy
          print('Audio libraries: OK')
          "

      - name: Verify ML libraries
        run: |
          python -c "
          import torch
          print(f'PyTorch: {torch.__version__}')
          print(f'CUDA available: {torch.cuda.is_available()}')
          import sys
          if sys.platform == 'darwin':
              print(f'MPS available: {torch.backends.mps.is_available()}')
          import transformers
          print(f'Transformers: {transformers.__version__}')
          import whisper
          print('Whisper: OK')
          print('ML libraries: OK')
          "

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy types-requests

      - name: Run mypy
        run: mypy localmind --ignore-missing-imports --no-error-summary || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run security scan
        run: bandit -r localmind/ -ll --skip B101

  dependency-security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ".[dev]"

      - name: Run dependency audit
        run: pip-audit --strict --progress-spinner=off

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test, security, dependency-security, platform-smoke-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Disable native CPU optimizations for llama-cpp-python (fixes ARM i8mm issue)
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: python packaging/scripts/build.py --no-installer --no-dmg --no-appimage --no-deb

      - name: Smoke test built executable (Linux)
        if: runner.os == 'Linux'
        run: |
          # Find the built executable
          EXECUTABLE=$(find dist -name "LocalMind" -type f -executable | head -1)
          if [ -n "$EXECUTABLE" ]; then
            echo "Testing executable: $EXECUTABLE"
            # Run with timeout, expecting it to start and exit cleanly
            timeout 10 xvfb-run --auto-servernum $EXECUTABLE --help || true
            echo "Desktop build smoke test: PASSED"
          else
            echo "No executable found, skipping smoke test"
          fi

      - name: Smoke test built executable (macOS)
        if: runner.os == 'macOS'
        run: |
          # Find the built app bundle
          APP_BUNDLE=$(find dist -name "LocalMind.app" -type d | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            echo "Testing app bundle: $APP_BUNDLE"
            # Check that the executable exists
            ls -la "$APP_BUNDLE/Contents/MacOS/"
            echo "Desktop build smoke test: PASSED"
          else
            echo "No app bundle found, skipping smoke test"
          fi

      - name: Smoke test built executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Find the built executable
          $executable = Get-ChildItem -Path dist -Filter "LocalMind.exe" -Recurse | Select-Object -First 1
          if ($executable) {
            Write-Host "Testing executable: $($executable.FullName)"
            # Just verify it exists and is executable
            if (Test-Path $executable.FullName) {
              Write-Host "Desktop build smoke test: PASSED"
            }
          } else {
            Write-Host "No executable found, skipping smoke test"
          }

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/LocalMind*/
